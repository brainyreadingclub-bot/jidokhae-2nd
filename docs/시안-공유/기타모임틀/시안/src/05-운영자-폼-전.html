<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="common.css"><title>운영자 모임 폼</title></head><body style="background:#fff">
<header class="ahdr"><svg class="menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="logo">지독해<small>관리자</small></span><span class="role">운영자</span></header>
<main class="amain"><h1>새 모임 등록</h1><div class="form">
<div class="field"><label>모임명<span class="req">*</span></label><div class="inp ph">독서모임 제목</div></div>
<div class="field"><label>모임 유형<span class="req">*</span></label><div class="types"><div class="type on">정기모임</div><div class="type">토론모임</div></div></div>
<div class="field"><label>모임 소개</label><div class="inp area ph">모임에 대한 간단한 소개 (선택)</div></div>
<div class="grid2"><div class="field"><label>날짜<span class="req">*</span></label><div class="inp">yyyy-mm-dd <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16"/></svg></div></div><div class="field"><label>시간<span class="req">*</span></label><div class="inp">-- --:-- <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></div></div></div>
<div class="field"><label>공간</label><div class="inp">기타 (직접 입력) <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></div></div>
<div class="field"><label>장소<span class="req">*</span></label><div class="inp ph">모임 장소</div></div>
<div class="field"><label>지역<span class="req">*</span></label><div class="inp">경주 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></div></div>
<div><div class="chk"><i></i>인라인 PICK 배너로 노출</div><p class="hint" style="margin-left:26px;margin-top:4px">체크 시 모임 일정 탭에서 눈에 띄게 표시됩니다</p></div>
<div class="grid2"><div class="field"><label>정원<span class="req">*</span></label><div class="inp ph">12</div></div><div class="field"><label>참가비<span class="req">*</span></label><div class="inp ph">12,000</div></div></div>
<div class="submit ">모임 등록</div>
</div></main></body></html>
