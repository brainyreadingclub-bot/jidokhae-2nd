<!DOCTYPE html>
<html lang="ko">
<head>

<link rel="stylesheet" href="_admin.css">
<style>
/* (next) 토스 스킨 — globals.css tg-* · brand* 값. 세리프 없음 */
body{background:#fff;color:var(--tg900);font-size:14px}
.memo{background:#FFF8D6;color:#5C4A00;font-size:12px;font-weight:600;padding:7px 16px;border-bottom:1px solid #EADFA8}
.wrap{max-width:640px;margin:0 auto;padding:4px 20px 120px}
.back{display:inline-flex;align-items:center;gap:4px;height:44px;font-size:15px;font-weight:700;color:var(--tg800)}
.done{margin-top:8px;display:flex;align-items:center;gap:10px;min-height:46px;border-radius:14px;background:var(--brand-bg);padding:10px 14px}
.done i{display:flex;width:20px;height:20px;flex:none;align-items:center;justify-content:center;border-radius:50%;background:var(--brand);color:#fff;font-size:10px;font-weight:700;font-style:normal}
.done span{flex:1;font-size:13px;font-weight:700;color:var(--brand-deep)}
.done b{font-size:12px;font-weight:700;color:var(--brand-deep)}
.book{margin-top:16px;display:flex;gap:16px}
.cover{width:96px;height:144px;flex:none;border-radius:6px;background:linear-gradient(160deg,#3a4a5a,#1f2a35);box-shadow:0 0 0 1px rgba(0,0,0,.06),0 8px 18px rgba(25,31,40,.18);display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:11px;font-weight:700;line-height:1.35}
.bt{align-self:center;min-width:0}
.bt .k{font-size:12px;font-weight:800;color:var(--brand)}
.bt .t{margin-top:4px;font-size:19px;font-weight:800;line-height:1.35;letter-spacing:-.02em}
.bt .a{margin-top:4px;font-size:12px;color:var(--tg600)}
.rows{margin-top:20px}
.rows div{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--tg100);font-size:14px}
.rows dt{width:56px;flex:none;color:var(--tg600)}
.rows dd{color:var(--tg900);font-weight:600}
.lnk{margin-top:16px;display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 0;border-top:1px solid var(--tg100)}
.lnk .ic{width:40px;height:40px;flex:none;border-radius:13px;background:var(--brand-bg);display:flex;align-items:center;justify-content:center;font-size:17px}
.lnk b{display:block;font-size:14px;font-weight:700}
.lnk small{display:block;margin-top:2px;font-size:12px;color:var(--tg600)}
.mem{margin-top:24px}
.mem .h{display:flex;justify-content:space-between;align-items:baseline}
.mem h3{font-size:13.5px;font-weight:700;color:var(--tg600)}
.mem .h span{font-size:12px;font-weight:600;color:var(--tg600)}
.mem ul{list-style:none;margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
.mem li{display:inline-flex;border-radius:999px;background:var(--tg100);padding:6px 12px;font-size:13px;font-weight:700;color:var(--tg800)}
.nav{position:fixed;left:0;right:0;bottom:0;height:56px;background:#fff;box-shadow:0 -1px 4px rgba(25,31,40,.05);display:flex}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;color:var(--tg500)}
.nav a.on{color:var(--tg900)}
.nav a i{width:22px;height:22px;border-radius:6px;background:currentColor;opacity:.25}
</style>
</head>
<body>
<div class="memo">시안 메모 — 회원 화면은 바뀌는 것 0. 발제자 초록고래도 다른 멤버와 똑같이 보인다</div>
<div class="wrap">
  <a class="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>토론모임</a>
  <div class="done"><i>✓</i><span>신청 완료</span><b>D-14</b></div>
  <div class="book">
    <div class="cover">실연당한 사람들을 위한 일곱 시 조찬모임</div>
    <div class="bt">
      <p class="k">10월 포항 토론모임</p>
      <p class="t">실연당한 사람들을 위한 일곱 시 조찬모임</p>
      <p class="a">백영옥 · 자음과모음</p>
    </div>
  </div>
  <dl class="rows">
    <div><dt>언제</dt><dd>10월 27일 (화) 오후 7:00</dd></div>
    <div><dt>어디서</dt><dd>공간 지그시 1711호 · 포항</dd></div>
    <div><dt>참여</dt><dd>4/10명</dd></div>
    <div><dt>참가비</dt><dd>25,000</dd></div>
  </dl>
  <div class="lnk"><span class="ic">📝</span><span style="flex:1"><b>발제문 먼저 읽어보기</b><small>답 안 써도 괜찮아요 — 와서 들으셔도 돼요</small></span></div>
  <section class="mem">
    <div class="h"><h3>함께하는 멤버</h3><span>4명</span></div>
    <ul><li>모서리</li><li>새벽책장</li><li>밑줄긋기</li><li>초록고래</li></ul>
  </section>
</div>
<nav class="nav"><a><i></i>홈</a><a class="on"><i></i>모임</a><a><i></i>이야기</a><a><i></i>서재</a><a><i></i>나</a></nav>
</body>
</html>
